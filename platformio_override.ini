; Coastal FX build for the WeGoIOT ESP32 WLED box (classic ESP32, WLED 16.0.1)
; Same as the stock "ESP32" release (keeps the mic / AudioReactive), plus the Coastal FX effects.
; Release name stays "ESP32" so the board's OTA update page accepts the file.

[platformio]
default_envs = coastal_esp32, coastal_esp32_eth

[env:coastal_esp32]
extends = env:esp32dev
custom_usermods = audioreactive coastal_fx

; The same effects for boards running WLED's "ESP32_Ethernet" release (classic ESP32 with an Ethernet
; port, like the Family Room RGBW Controller). Release name stays "ESP32_Ethernet" so those boards'
; OTA update page accepts the file, and Ethernet keeps working.
[env:coastal_esp32_eth]
extends = env:esp32_eth
custom_usermods = audioreactive coastal_fx
