; Coastal FX build for the WeGoIOT ESP32 WLED box (classic ESP32, WLED 16.0.1)
; Same as the stock "ESP32" release (keeps the mic / AudioReactive), plus the Coastal FX effects.
; Release name stays "ESP32" so the board's OTA update page accepts the file.

[platformio]
default_envs = coastal_esp32

[env:coastal_esp32]
extends = env:esp32dev
custom_usermods = audioreactive coastal_fx
